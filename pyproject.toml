[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "adbcat"
version = "0.1.0"
description = "Terminal UI for adb logcat with Android Studio style filtering"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Galvany Technologies" }]
requires-python = ">=3.9"
dependencies = ["textual>=8.0"]
keywords = ["android", "adb", "logcat", "tui", "terminal"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Debuggers",
]

[project.urls]
Homepage = "https://github.com/mr-ceo7/adbcat"
Issues = "https://github.com/mr-ceo7/adbcat/issues"

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio"]

[project.scripts]
adbcat = "adbcat.__main__:main"

[tool.setuptools]
packages = ["adbcat"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
